<section class="about-section section-shell" id="about" aria-labelledby="about-title">
  <div class="about-section__card glass-panel section-card">
    <div class="about-section__layout">
      <figure class="about-section__portrait">
        <img
          src="/images/tania-about.webp"
          [alt]="content().aboutImageAlt"
          width="720"
          height="960"
          loading="lazy"
          decoding="async"
        />
      </figure>

      <div class="about-section__content">
        <h2 id="about-title">{{ content().sectionTitles.about }}</h2>
        <div class="about-section__copy">
          @for (paragraph of content().about; track $index) {
            <p>{{ paragraph }}</p>
          }
        </div>
      </div>
    </div>
  </div>
</section>
