<div class="city-background" aria-hidden="true"></div>

<a class="skip-link" href="#main-content">{{ content().skipLink }}</a>

<app-site-header />

@if (!hasActiveRoute()) {
  <main id="main-content" class="app-main" tabindex="-1">
    <app-hero-section />
    <app-experience-section />
    <app-projects-section />
    <app-about-section />
    <app-skills-section />
    <app-education-section />
    <app-training-section />
    <app-certifications-section />
  </main>

  <footer class="app-footer">
    <app-contact-section />
  </footer>
}

<router-outlet
  (activate)="hasActiveRoute.set(true)"
  (deactivate)="hasActiveRoute.set(false)"
/>
